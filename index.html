<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Date Night Picker 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
          text-align: center;
          background: #ffe066;
          font-family: 'Fredoka One', cursive, sans-serif;
        }

        h1 {
          margin-bottom: 20px;
          font-family: 'Fredoka One', cursive, sans-serif;
          font-size: 2.5em;
          background: #fff200;
          color: #1a1a1a;
          padding: 18px 40px;
          border-radius: 30px;
          box-shadow: 0 6px 0 #ffb300, 0 4px 16px rgba(0,0,0,0.10);
          display: inline-block;
          letter-spacing: 2px;
          border: 4px solid #1a1a1a;
          text-shadow: 2px 2px 0 #fff, 4px 4px 0 #1a1a1a;
        }

        .pointer {
          position: absolute;
          top: -55px;
          left: 50%;
          transform: translateX(-50%);
          width: 80px;
          height: 80px;
          background: #fff200;
          border-radius: 50%;
          box-shadow: 0 4px 0 #ffb300, 0 2px 8px rgba(0,0,0,0.12);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 2;
          border: 4px solid #1a1a1a;
        }
        .pointer::after {
          content: "";
          display: block;
          width: 0;
          height: 0;
          border-left: 24px solid transparent;
          border-right: 24px solid transparent;
          border-top: 42px solid #ff595e;
          margin-top: 4px;
          filter: drop-shadow(0 2px 0 #1a1a1a);
        }

        .wheel-wrapper {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          max-width: 900px;
          margin: 60px auto;
          gap: 36px;
        }
        .wheel-area {
          position: relative;
          width: 480px;
          height: 480px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
        }
        .result-area {
          min-width: 220px;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 480px;
        }

        #wheel {
          width: 100%;
          height: 100%;
          object-fit: contain;
          transform-origin: 50% 50%;
          transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
          display: block;
        }
        #wheel-rotator {
          width: 100%;
          height: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
          transform-origin: 50% 50%;
          transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
        }
        #wheel-rotator img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          display: block;
          position: relative;
          filter: drop-shadow(0 4px 0 #1a1a1a);
        }

        button {
          margin-top: 0;
          padding: 14px 32px;
          border: 4px solid #1a1a1a;
          border-radius: 30px;
          background: #3ae374;
          color: #1a1a1a;
          font-size: 20px;
          font-family: 'Fredoka One', cursive, sans-serif;
          cursor: pointer;
          transition: 0.2s;
          box-shadow: 0 4px 0 #26c485;
          text-shadow: 1px 1px 0 #fff;
        }
        button:hover {
          background: #ff595e;
          color: #fff;
          box-shadow: 0 4px 0 #d7263d;
        }
        .reset {
          background: #ffd166;
          color: #1a1a1a;
          margin-left: 10px;
          box-shadow: 0 4px 0 #ffb300;
        }
        .reset:hover {
          background: #118ab2;
          color: #fff;
          box-shadow: 0 4px 0 #073b4c;
        }
        #result {
          font-size: 28px;
          font-weight: bold;
          color: #1a1a1a;
          text-shadow: 2px 2px 0 #fff, 4px 4px 0 #1a1a1a;
          background: #fff200;
          border-radius: 24px;
          border: 4px solid #1a1a1a;
          padding: 32px 18px;
          box-shadow: 0 4px 0 #ffb300;
          min-width: 220px;
          min-height: 80px;
          max-width: 260px;
          max-height: 120px;
          width: 240px;
          height: 100px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          word-break: break-word;
        }
        .button-row {
          display: flex;
          justify-content: center;
          gap: 10px;
          margin-top: 18px;
        }
    </style>
</head>

<body>

<h1>🎡 Date Night Picker 💕</h1>

<div class="wheel-wrapper">
    <div class="wheel-area">
        <div class="pointer"></div>
        <div id="wheel-rotator">
            <img src="wheel.png" alt="Date Wheel">
        </div>
        <div class="button-row">
            <button id="spinBtn">Spin 💖</button>
            <button id="resetBtn" class="reset">Reset</button>
        </div>
    </div>
    <div class="result-area">
        <div id="result"></div>
    </div>
</div>


<script>
    const wheel = document.getElementById("wheel-rotator");
    const spinBtn = document.getElementById("spinBtn");
    const resetBtn = document.getElementById("resetBtn");
    const result = document.getElementById("result");

    const dates = [
      "Pizza 🍕",
      "Mini Golf ⛳",
      "Fitness Activity 💪",
      "Park Walk 🌿",
      "Coffee ☕",
      "Picnic 🥞",
      "Drinks & Clubbing 🍸",
      "Cinema 🎬"
    ];

    let currentRotation = 0;
    let isSpinning = false;
    let pendingResult = null;

    spinBtn.addEventListener("click", () => {
      if (isSpinning) return;

      isSpinning = true;
      result.textContent = "Spinning... 💫";

      // Select a random activity
      const randomIndex = Math.floor(Math.random() * dates.length);
      const segmentAngle = 360 / dates.length;
      const extraSpins = 5 * 360;

      // Calculate the final angle so the pointer lands at the center of the segment
      const finalAngle = extraSpins + (360 - randomIndex * segmentAngle - segmentAngle / 2);

      currentRotation += finalAngle;
      wheel.style.transition = "transform 4s cubic-bezier(0.33, 1, 0.68, 1)";
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      // Store the result to be shown after the spin
      pendingResult = `You got: ${dates[randomIndex]} 💕`;
    });

    wheel.addEventListener("transitionend", (e) => {
      if (pendingResult && isSpinning) {
        result.textContent = pendingResult;
        pendingResult = null;
        isSpinning = false;
      }
    });

    resetBtn.addEventListener("click", () => {
      currentRotation = 0;
      wheel.style.transition = "transform 2s cubic-bezier(0.33, 1, 0.68, 1)";
      wheel.style.transform = "rotate(0deg)";
      result.textContent = "";
      isSpinning = false;
      pendingResult = null;
    });
</script>

</body>
</html>
